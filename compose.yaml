services:
  searxng:
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8080}:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
      - searxng-data:/var/cache/searxng
    depends_on:
      - valkey

  valkey:
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - valkey-data:/data

  deep-re-searxng:
    build:
      context: .
    restart: unless-stopped
    environment:
      SEARXNG_URL: http://searxng:8080
      MCP_HTTP_PORT: "3000"
      MCP_HTTP_HOST: 0.0.0.0
      SEARXNG_DEFAULT_LANGUAGE: ${SEARXNG_DEFAULT_LANGUAGE:-all}
      SEARXNG_MAX_RESULTS: ${SEARXNG_MAX_RESULTS:-10}
      SEARXNG_MAX_RESULT_CHARS: ${SEARXNG_MAX_RESULT_CHARS:-700}
      URL_READ_MAX_CHARS: ${URL_READ_MAX_CHARS:-12000}
      FETCH_TIMEOUT_MS: ${FETCH_TIMEOUT_MS:-15000}
    ports:
      - "127.0.0.1:${MCP_HTTP_PORT:-3000}:3000"
    depends_on:
      - searxng

volumes:
  searxng-data:
  valkey-data:
